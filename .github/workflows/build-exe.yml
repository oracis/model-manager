name: Build EXE

# 每次 push 到 main 自动出 exe（作为可下载 artifact）；
# 每次发布 GitHub Release 时，自动把两个 exe 挂到该 Release 上。
# 真正的 Windows .exe 只能在 Windows runner 上用 PyInstaller 生成，故用 windows-latest。
on:
  push:
    branches: [main]
    paths:
      - "**.pyw"
      - "build_exe.cmd"
      - "mm.ico"
      - ".github/workflows/build-exe.yml"
  release:
    types: [published]

permissions:
  contents: write   # release 上传附件需要写权限

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build model_manager.exe
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed `
            --name model_manager `
            --icon "${{ github.workspace }}\mm.ico" `
            --distpath dist `
            --workpath build_tmp `
            --specpath build_tmp `
            model_manager.pyw

      - name: Build claude_switcher.exe
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed `
            --name claude_switcher `
            --icon "${{ github.workspace }}\mm.ico" `
            --distpath dist `
            --workpath build_tmp `
            --specpath build_tmp `
            claude_model_switcher.pyw

      - name: Upload artifacts (push to main)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: exes
          path: dist/*.exe

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/model_manager.exe dist/claude_switcher.exe
